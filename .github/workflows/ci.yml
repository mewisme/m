name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  no-cgo-gate:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: No-CGO test, vet, and build
        run: |
          go test ./internal/archcheck/... -count=1 -run TestProduction
          go test ./... -count=1
          go vet ./...
          go build ./cmd/m
          go build ./cmd/mx

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Test
        run: go test ./... -count=1
      - name: Vet
        run: go vet ./...
      - name: Build
        run: |
          go build -o bin/m${{ matrix.os == 'windows-latest' && '.exe' || '' }} ./cmd/m
          go build -o bin/mx${{ matrix.os == 'windows-latest' && '.exe' || '' }} ./cmd/mx
      - name: Doctor stub
        run: go run ./cmd/m development doctor

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Race
        run: go test -race ./... -count=1

  race-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Race (transaction, store, fsx)
        run: go test -race ./internal/transaction/... ./internal/store/... ./internal/fsx/... -count=1

  crash-shard-verify:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Prove crash tests partition Windows shards
        run: go run ./tools/ci/verify-crash-shards

  crash-integration:
    needs: crash-shard-verify
    name: crash-integration (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu-latest
            os: ubuntu-latest
            shard: full
            run: Crash
          - label: windows-latest/snapshot
            os: windows-latest
            shard: snapshot
            run: TestSnapshotCrash|TestWorkspaceSnapshotRestoreCrash
          - label: windows-latest/install
            os: windows-latest
            shard: install
            run: TestTxnCrash
          - label: windows-latest/update
            os: windows-latest
            shard: update
            run: TestUpdateCrash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Process crash matrix (${{ matrix.shard }})
        id: crash
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          go test -tags crash ./tests/integration/... -count=1 -run '${{ matrix.run }}' -timeout 30m
          end=$(date +%s)
          duration=$((end - start))
          echo "duration=${duration}" >> "$GITHUB_OUTPUT"
          echo "${duration}" > crash-duration.txt
      - name: Upload shard timing
        if: always() && steps.crash.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: crash-timing-${{ matrix.os }}-${{ matrix.shard }}
          path: crash-duration.txt
          retention-days: 7

  crash-integration-report:
    needs: crash-integration
    if: always() && !cancelled() && needs.crash-integration.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: crash-timing-*
          path: timings
          merge-multiple: false
      - name: Compare Windows shard durations to sequential baseline
        shell: bash
        run: |
          set -euo pipefail
          baseline=420
          {
            echo "## Crash integration timings"
            echo ""
            echo "| Shard | Duration |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          max_win=0
          max_win_label=""
          for dir in timings/crash-timing-*; do
            [ -d "$dir" ] || continue
            name="${dir#timings/crash-timing-}"
            dur="$(tr -d '[:space:]' < "$dir/crash-duration.txt")"
            mins=$((dur / 60))
            secs=$((dur % 60))
            echo "| ${name} | ${mins}m ${secs}s (${dur}s) |" >> "$GITHUB_STEP_SUMMARY"
            case "$name" in
              windows-latest-*)
                if [ "$dur" -gt "$max_win" ]; then
                  max_win=$dur
                  max_win_label=$name
                fi
                ;;
            esac
          done
          {
            echo ""
            echo "**Previous sequential Windows job:** ~7m (${baseline}s)"
            if [ "$max_win" -gt 0 ]; then
              max_mins=$((max_win / 60))
              max_secs=$((max_win % 60))
              echo "**Longest Windows shard (${max_win_label}):** ${max_mins}m ${max_secs}s (${max_win}s)"
              if [ "$max_win" -lt "$baseline" ]; then
                saved=$((baseline - max_win))
                saved_mins=$((saved / 60))
                saved_secs=$((saved % 60))
                echo "**Parallel wall-clock savings vs sequential:** ~${saved_mins}m ${saved_secs}s (${saved}s)"
              else
                echo "**Note:** longest shard exceeds sequential baseline; check shard balance."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  race-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Race (transaction, store, resolver)
        run: go test -race ./internal/transaction/... ./internal/store/... ./internal/resolver/... -count=1

  platform-lock:
    name: platform-lock (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Cross-process lock and identity tests
        run: go test ./internal/transaction/... ./internal/store/... ./internal/fsx/... -count=1 -run 'Proc|Identity|Takeover|Import|ABA'

  cross:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -o "/tmp/m-${GOOS}-${GOARCH}${ext}" ./cmd/m
          go build -o "/tmp/mx-${GOOS}-${GOARCH}${ext}" ./cmd/mx

  lint:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Load tool versions
        id: ver
        run: |
          set -a
          # shellcheck disable=SC1091
          source tools/versions.env
          set +a
          echo "golangci=${GOLANGCI_LINT_VERSION}" >> "$GITHUB_OUTPUT"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.ver.outputs.golangci }}
      - name: Verify go.mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  vuln:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: govulncheck
        run: |
          set -a
          # shellcheck disable=SC1091
          source tools/versions.env
          set +a
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          govulncheck ./...

  allowlist:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: License and deps
        run: |
          go run ./tools/check-license
          go run ./tools/check-deps
          go test ./tools/check-deps -count=1

  gate-probe:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Prove go vet fails on bad input
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          cd "$dir"
          go mod init badprobe
          cat >bad.go <<'EOF'
          package badprobe
          import "fmt"
          func F() { x := 1 }
          EOF
          if go vet ./...; then
            echo "expected go vet to fail" >&2
            exit 1
          fi
          echo "ok: go vet rejected bad input"
      - name: Prove allowlist probe rejects banned module
        run: go test ./tools/check-deps -count=1 -run TestAllowlistRejectsUnknown

  fixture-verify:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Verify lock bridge fixtures
        run: go run ./tools/conformance/verify-fixtures

  conformance-pnpm-9:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Load pnpm versions
        id: pnpm
        run: |
          set -a
          # shellcheck disable=SC1091
          source tools/conformance/pnpm-versions.env
          set +a
          echo "version=$PNPM9_VERSION" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: pnpm 9 lock bridge conformance
        run: go test ./tests/conformance/... -count=1 -run 'TestLockBridgePnpm9($|MutationSuite|PeerContext)' -v

  conformance-pnpm-10:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Load pnpm versions
        id: pnpm
        run: |
          set -a
          # shellcheck disable=SC1091
          source tools/conformance/pnpm-versions.env
          set +a
          echo "version=$PNPM10_VERSION" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: pnpm 10 lock bridge conformance
        run: go test ./tests/conformance/... -count=1 -run 'TestLockBridgePnpm10($|MutationSuite|PeerContext)' -v

  conformance-pnpm-11:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Load pnpm versions
        id: pnpm
        run: |
          set -a
          # shellcheck disable=SC1091
          source tools/conformance/pnpm-versions.env
          set +a
          echo "version=$PNPM11_VERSION" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: pnpm 11 lock bridge conformance
        run: go test ./tests/conformance/... -count=1 -run 'TestLockBridgePnpm11($|MutationSuite|PeerContext)' -v

  conformance-pnpm-unsupported:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: pnpm legacy lock rejection
        run: go test ./tests/conformance/... -count=1 -run TestLockBridgePnpmUnsupported -v

  conformance-npm:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm lock bridge conformance
        run: go test ./tests/conformance/... -count=1 -run Npm -v

  conformance-bun:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: bun lock bridge conformance
        run: go test ./tests/conformance/... -count=1 -run Bun -v

  conformance-yarn:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: yarn lock bridge conformance
        run: go test ./tests/conformance/... -count=1 -run Yarn -v

  conformance-nub-fixtures:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Nub lock fixture validation
        run: go test ./tests/conformance/... -count=1 -run TestLockBridgeNubFixtures -v
