name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Test
        run: go test ./... -count=1
      - name: Vet
        run: go vet ./...
      - name: Build
        run: |
          go build -o bin/m${{ matrix.os == 'windows-latest' && '.exe' || '' }} ./cmd/m
          go build -o bin/mx${{ matrix.os == 'windows-latest' && '.exe' || '' }} ./cmd/mx
      - name: Doctor stub
        run: go run ./cmd/m development doctor

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Race
        run: go test -race ./... -count=1

  race-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Race (transaction, store, fsx)
        run: go test -race ./internal/transaction/... ./internal/store/... ./internal/fsx/... -count=1

  crash-integration:
    name: crash-integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Process crash matrix (install, update, snapshot restore)
        run: go test -tags crash ./tests/integration/... -count=1 -run 'Crash' -timeout 30m

  race-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Race (transaction, store, resolver)
        run: go test -race ./internal/transaction/... ./internal/store/... ./internal/resolver/... -count=1

  platform-lock:
    name: platform-lock (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Cross-process lock and identity tests
        run: go test ./internal/transaction/... ./internal/store/... ./internal/fsx/... -count=1 -run 'Proc|Identity|Takeover|Import|ABA'

  cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -o "/tmp/m-${GOOS}-${GOARCH}${ext}" ./cmd/m
          go build -o "/tmp/mx-${GOOS}-${GOARCH}${ext}" ./cmd/mx

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Load tool versions
        id: ver
        run: |
          set -a
          # shellcheck disable=SC1091
          source tools/versions.env
          set +a
          echo "golangci=${GOLANGCI_LINT_VERSION}" >> "$GITHUB_OUTPUT"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.ver.outputs.golangci }}

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: govulncheck
        run: |
          set -a
          # shellcheck disable=SC1091
          source tools/versions.env
          set +a
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          govulncheck ./...

  allowlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: License and deps
        run: |
          go run ./tools/check-license
          go run ./tools/check-deps
          go test ./tools/check-deps -count=1

  gate-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Prove go vet fails on bad input
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          cd "$dir"
          go mod init badprobe
          cat >bad.go <<'EOF'
          package badprobe
          import "fmt"
          func F() { x := 1 }
          EOF
          if go vet ./...; then
            echo "expected go vet to fail" >&2
            exit 1
          fi
          echo "ok: go vet rejected bad input"
      - name: Prove allowlist probe rejects banned module
        run: go test ./tools/check-deps -count=1 -run TestAllowlistRejectsUnknown

  conformance-pnpm-9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: pnpm 9 lock bridge conformance
        run: go test ./tests/conformance/... -count=1 -run TestLockBridgePnpm9 -v

  conformance-pnpm-10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: pnpm 10 lock bridge conformance
        run: go test ./tests/conformance/... -count=1 -run TestLockBridgePnpm10 -v

  conformance-pnpm-11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: pnpm 11 lock bridge conformance
        run: go test ./tests/conformance/... -count=1 -run TestLockBridgePnpm11 -v

  conformance-pnpm-unsupported:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: pnpm legacy lock rejection
        run: go test ./tests/conformance/... -count=1 -run TestLockBridgePnpmUnsupported -v

  conformance-nub-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Nub lock fixture validation
        run: go test ./tests/conformance/... -count=1 -run TestLockBridgeNubFixtures -v
